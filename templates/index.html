<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우울증 진단 프로그램</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #fce4ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: #5c7cad;
            margin-bottom: 8px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, #b3d4f5, #f5b3d4);
            border-radius: 2px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 15px;
            font-size: 14px;
            font-family: 'Malgun Gothic', sans-serif;
            border: 1.5px solid #e0ecf8;
            border-radius: 12px;
            resize: vertical;
            outline: none;
            color: #555;
            line-height: 1.7;
            transition: border 0.2s;
        }

        textarea:focus {
            border-color: #90bce8;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(to right, #90bce8, #f0a8c8);
            color: white;
            font-size: 16px;
            font-family: 'Malgun Gothic', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }

        .notice {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 우울증 진단 프로그램</h1>
            <p>상담 스크립트를 입력하면 우울증 위험도를 분석해드립니다</p>
        </div>
        <div class="divider"></div>
        <form action="/analyze" method="POST">
            <label>상담 스크립트 입력</label>
            <textarea name="script" placeholder="상담사: 요즘 어떠세요?
내담자: 너무 힘들어요..."></textarea>
            <button type="submit">분석 시작 →</button>
        </form>
        <p class="notice">※ 입력된 내용은 저장되지 않습니다</p>
    </div>
</body>
</html>
